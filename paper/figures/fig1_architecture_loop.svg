<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/></marker>
</defs>
<rect width="960" height="620" fill="#ffffff"/>
<text x="28" y="30" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6169" text-anchor="start">A</text><text x="46" y="30" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111111" text-anchor="start">The five-link strange loop</text>
<text x="28" y="48" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5b6169" text-anchor="start" font-style="italic">Solid: first-order loop L1–L3.  Dashed: second-order reliability loop L4–L5.</text>
<path d="M 74 180 C 54 236, 270 262, 348 286" fill="none" stroke="#1f4e79" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M 330 322 C 250 352, 282 250, 282 182" fill="none" stroke="#1f4e79" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="34" y="110" width="150" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.2" /><text x="46" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111111" text-anchor="start">M1  self-model</text><text x="46" y="149" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5b6169" text-anchor="start">energy · cost · fatigue</text>
<rect x="236" y="110" width="130" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.2" /><text x="248" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Action</text><text x="248" y="149" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5b6169" text-anchor="start">MOVE / REST</text>
<rect x="418" y="110" width="160" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.2" /><text x="430" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Evidence</text><text x="430" y="149" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5b6169" text-anchor="start">interoceptive residual</text>
<rect x="630" y="110" width="160" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.2" /><text x="642" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111111" text-anchor="start">M1 update</text><text x="642" y="149" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5b6169" text-anchor="start">first-order learning</text>
<rect x="330" y="286" width="136" height="70" fill="#ffffff" stroke="#1f4e79" stroke-width="1.2" /><text x="342" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111111" text-anchor="start">M2  meta-model</text><text x="342" y="325" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5b6169" text-anchor="start">trust · bias</text>
<line x1="187" y1="145" x2="233" y2="145" stroke="#111111" stroke-width="1.4" marker-end="url(#arrow)" />
<line x1="369" y1="145" x2="415" y2="145" stroke="#111111" stroke-width="1.4" marker-end="url(#arrow)" />
<line x1="581" y1="145" x2="627" y2="145" stroke="#111111" stroke-width="1.4" marker-end="url(#arrow)" />
<text x="190" y="100" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#5b6169" text-anchor="start">L1 prediction → action</text>
<text x="375" y="100" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#5b6169" text-anchor="start">L2 action → evidence</text>
<text x="600" y="100" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#5b6169" text-anchor="start">L3 evidence → M1</text>
<text x="150" y="236" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#1f4e79" text-anchor="start">L4  M1 → M2</text>
<text x="170" y="366" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#1f4e79" text-anchor="start">L5  M2 → control</text>
<line x1="28" y1="410" x2="932" y2="410" stroke="#e3e0d8" stroke-width="1" />
<text x="28" y="434" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#111111" text-anchor="start">Operational mechanisms</text>
<text x="28" y="462" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#111111" text-anchor="start">Interoception</text>
<text x="28" y="478" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#5b6169" text-anchor="start" font-style="italic">4 noisy channels</text>
<text x="28" y="494" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#5b6169" text-anchor="start">energy, strain, effort, slip</text>
<text x="260" y="462" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#111111" text-anchor="start">Attribution</text>
<text x="260" y="478" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#5b6169" text-anchor="start" font-style="italic">action-conditioned</text>
<text x="260" y="494" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#5b6169" text-anchor="start">MOVE vs REST residual contrast</text>
<text x="492" y="462" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#111111" text-anchor="start">PP-1</text>
<text x="492" y="478" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#5b6169" text-anchor="start" font-style="italic">precision-weighted error</text>
<text x="492" y="494" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#5b6169" text-anchor="start">transient gain on single-channel outliers</text>
<text x="724" y="462" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#111111" text-anchor="start">AST-1</text>
<text x="724" y="478" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#5b6169" text-anchor="start" font-style="italic">attention schema</text>
<text x="724" y="494" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#5b6169" text-anchor="start">5-window model of its own precision weights</text>
<rect x="28" y="520" width="904" height="76" fill="#faf8f2" stroke="#e3e0d8" stroke-width="1" />
<text x="44" y="542" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5b6169" text-anchor="start">Every edge is a switchable ablation. L1 self-influence · L2 action–evidence link · L3 first-order learning · L4 meta learning · L5 meta feedback.</text>
<text x="44" y="560" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#a6402a" text-anchor="start">M1 and M2 are predictors and controllers with measurable behaviour; no claim of consciousness or subjective experience is made.</text>
</svg>
